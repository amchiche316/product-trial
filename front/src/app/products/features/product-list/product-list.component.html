<h1 class="text-center">Liste des produits</h1>

<p-button label="Créer produit" (onClick)="onCreate()" class="block text-center"/>

<p-dataView #dv [value]="products()">
    <ng-template pTemplate="list" let-products>
        @for (product of products; track product) {
            <p-card class="block mb-2">
                <span class="font-medium text-secondary text-sm">{{ product.category }}</span>
                <div class="text-lg font-medium text-900 mt-2">{{ product.name }}</div>
                <!--img *ngIf="product.image"  [src] ="product.image" alt ="{{product.name}}" class ="w-full h-40 object-cover mb-2"/>
                <span class="front-medium text-secondary text-sm">{{product.category}}</span    -->
                    <p class = "text-sm text-gray-700" >{{product.description}}</p>
                     <p class = "font-bold mt-1" > Prix: {{product.price | currency: 'EUR' }}</p>
                   <p>Quantité en stock: {{product.quantity}}</p>  
                  <p *ngIf="product.inventoryStatus !== 'INSTOCK'" class ="text-red-600 font-semibold">{{product.inventoryStatus}}</p> 


                <ng-template pTemplate="footer">
                    <div class="flex gap-3 mt-1">
                        <p-button label="Modifier" severity="secondary" (onClick)="onUpdate(product)"/>
                        <p-button label="Supprimer" severity="danger" (onClick)="onDelete(product)" />
                          <p-button label="Ajouter au panier"  (onClick)="addToCart(product)" class ="mt-2" />
                    </div>
                </ng-template>
            </p-card>
        }
    </ng-template>
</p-dataView>

<p-dialog [(visible)]="isDialogVisible"
    [style]="{ width: '50vw' }"
    header="Ajout/Edition produit">
    <app-product-form
        [product]="editedProduct()"
        (save)="onSave($event)"
        (cancel)="onCancel()"
    />
</p-dialog>
